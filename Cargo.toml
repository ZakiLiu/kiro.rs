[package]
name = "kiro-rs"
version = "2.0.24"
edition = "2024"
license = "MIT"
description = "Anthropic Claude API 兼容的 Kiro 代理服务，支持多凭据、自动故障转移、流式响应和 Web 管理界面"
repository = "https://github.com/ZakiLiu/kiro.rs"
readme = "README.md"

[profile.release]
lto = "thin"
strip = true

[features]
default = []
# 显式启用才允许打印潜在敏感信息（仅用于排障）
sensitive-logs = []
pdf-support = ["dep:lopdf"]

[dependencies]
axum = "0.8"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "socks", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }  # IndexMap-backed Value::Object — preserves field order through deserialize→serialize round-trip (required for kiro-cli wire byte-alignment)
serde_cbor = "0.11"   # CBOR 编解码（Web Portal API）
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
http = "1.0"
futures = "0.3"
async-stream = "0.3"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v1", "v4", "v5", "fast-rng"] }  # v5 used to derive deterministic agentContinuationId from conversationId (multi-turn stability)
fastrand = "2"
sha2 = "0.10"
hex = "0.4"
crc = "3"           # CRC32C 计算
bytes = "1"         # 高效的字节缓冲区
tower-http = { version = "0.6", features = ["cors", "compression-gzip"] }
clap = { version = "4.5", features = ["derive"] }
urlencoding = "2"
parking_lot = "0.12"  # 高性能同步原语
subtle = "2.6"        # 常量时间比较（防止时序攻击）
rust-embed = "8"      # 嵌入静态文件
mime_guess = "2"      # MIME 类型推断
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }  # 图片处理
base64 = "0.22"       # Base64 编解码
lopdf = { version = "0.39", optional = true }  # PDF 文本提取（pdf-support feature）
rusqlite = { version = "0.33", features = ["bundled"] }  # SQLite（请求追踪）
regex = "1"            # 系统提示词限制剥离
flate2 = "1"           # tar.gz 解压（自动更新）
tar = "0.4"            # tar 提取（自动更新）
zip = { version = "2", features = ["deflate"] }  # zip 解压（自动更新，Windows）
